[project]
name = "nightwatch-course"
version = "0.1.0"
description = "Build an AI Agent from Scratch with LangGraph - course code"
requires-python = ">=3.11"
dependencies = [
  "openai>=2",
  "httpx",
  "pydantic>=2",
  "python-dotenv",
  "langgraph>=1.2,<1.3",
  "langchain>=1.5,<1.6",
  "langchain-openai",
  "langchain-groq",
  "pytest",
  "ipykernel",
  "jupyterlab",
  "tiktoken",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["nightwatch"]
testpaths = ["nightwatch/tests"]
